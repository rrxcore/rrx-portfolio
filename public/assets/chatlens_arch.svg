<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="chatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020813"/>
      <stop offset="40%" stop-color="#051224"/>
      <stop offset="80%" stop-color="#081832"/>
      <stop offset="100%" stop-color="#02070f"/>
    </linearGradient>

    <!-- Node Card Gradients -->
    <linearGradient id="ingestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071829"/>
      <stop offset="100%" stop-color="#030c17"/>
    </linearGradient>

    <linearGradient id="memoryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08211d"/>
      <stop offset="100%" stop-color="#03110f"/>
    </linearGradient>

    <linearGradient id="virtualGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f2b"/>
      <stop offset="100%" stop-color="#070417"/>
    </linearGradient>

    <!-- Glowing Wire Gradients -->
    <linearGradient id="wireCyanEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="wireEmeraldViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="chatPacketGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="chatSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="chatGrid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#00f2fe" stroke-width="0.6" stroke-opacity="0.04"/>
      <circle cx="0" cy="0" r="1" fill="#00f2fe" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <style>
    <![CDATA[
    @keyframes dashStream {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes packetHop1 {
      0% { transform: translateX(0px); opacity: 0; }
      15% { opacity: 1; }
      45% { transform: translateX(65px); opacity: 1; }
      55% { transform: translateX(65px); opacity: 0; }
      100% { transform: translateX(65px); opacity: 0; }
    }
    @keyframes packetHop2 {
      0% { transform: translateX(0px); opacity: 0; }
      50% { transform: translateX(0px); opacity: 0; }
      60% { opacity: 1; }
      90% { transform: translateX(65px); opacity: 1; }
      100% { transform: translateX(65px); opacity: 0; }
    }
    @keyframes nodeActiveCyan {
      0%, 100% { stroke: #00f2fe; stroke-opacity: 0.35; }
      25% { stroke: #00f2fe; stroke-opacity: 0.95; }
      50% { stroke: #00f2fe; stroke-opacity: 0.35; }
    }
    @keyframes nodeActiveEmerald {
      0%, 100% { stroke: #10b981; stroke-opacity: 0.35; }
      50% { stroke: #10b981; stroke-opacity: 0.95; }
      75% { stroke: #10b981; stroke-opacity: 0.35; }
    }
    @keyframes nodeActiveViolet {
      0%, 100% { stroke: #8b5cf6; stroke-opacity: 0.35; }
      75% { stroke: #8b5cf6; stroke-opacity: 0.95; }
      98% { stroke: #8b5cf6; stroke-opacity: 0.35; }
    }
    @keyframes liveBeacon {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .flow-wire {
      stroke-dasharray: 6 5;
      animation: dashStream 1.2s linear infinite;
    }
    .packet-1 {
      animation: packetHop1 4s ease-in-out infinite;
    }
    .packet-2 {
      animation: packetHop2 4s ease-in-out infinite;
    }
    .box-ingest {
      animation: nodeActiveCyan 4s ease-in-out infinite;
    }
    .box-memory {
      animation: nodeActiveEmerald 4s ease-in-out infinite;
    }
    .box-virtual {
      animation: nodeActiveViolet 4s ease-in-out infinite;
    }
    .beacon {
      animation: liveBeacon 1.8s infinite;
    }
    .mono {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', 'Courier New', monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
    }
    ]]>
  </style>

  <!-- ================= CANVAS BACKGROUND ================= -->
  <rect width="1200" height="520" fill="url(#chatBg)" rx="16"/>
  <rect width="1200" height="520" fill="url(#chatGrid)" rx="16"/>
  <rect x="2" y="2" width="1196" height="516" rx="15" fill="none" stroke="#00f2fe" stroke-opacity="0.25" stroke-width="1.2"/>

  <!-- ================= TOP HUD HEADER ================= -->
  <g transform="translate(40, 36)">
    <!-- Terminal dots -->
    <circle cx="0" cy="0" r="4" fill="#ef4444" fill-opacity="0.9"/>
    <circle cx="12" cy="0" r="4" fill="#eab308" fill-opacity="0.9"/>
    <circle cx="24" cy="0" r="4" fill="#22c55e" fill-opacity="0.9"/>

    <!-- Title and Subtitle -->
    <text x="42" y="4" fill="#f8fafc" font-size="12" font-weight="700" class="mono" letter-spacing="2">
      CHATLENS ENGINE <tspan fill="#64748b">//</tspan> <tspan fill="#00f2fe">CLIENT-SIDE 60 FPS VIRTUALIZATION PIPELINE</tspan>
    </text>

    <!-- Live Status Capsule -->
    <g transform="translate(930, -12)">
      <rect x="0" y="0" width="150" height="24" rx="12" fill="#04121a" stroke="#10b981" stroke-opacity="0.5" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#10b981" class="beacon"/>
      <text x="24" y="16" fill="#10b981" font-size="9" font-weight="700" class="mono" letter-spacing="1">60 FPS RENDER LOOP</text>
    </g>
  </g>

  <!-- ================= CONDUIT 1: INGESTION ➔ IN-MEMORY (Between x=370 and x=435) ================= -->
  <g transform="translate(370, 235)">
    <!-- Conduit backing pipe -->
    <line x1="0" y1="0" x2="65" y2="0" stroke="#071b26" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="65" y2="0" stroke="url(#wireCyanEmerald)" stroke-width="3" class="flow-wire" stroke-linecap="round"/>
    
    <!-- Conduit Label Badge (Centered, fits neatly inside 65px gap without clipping) -->
    <g transform="translate(32, -22)">
      <rect x="-28" y="-9" width="56" height="18" rx="9" fill="#040e1a" stroke="#00f2fe" stroke-opacity="0.6" stroke-width="1"/>
      <text x="0" y="3.5" text-anchor="middle" fill="#38bdf8" font-size="8" font-weight="700" class="mono">PARSED</text>
    </g>

    <!-- Animated Data Packet 1 -->
    <g class="packet-1">
      <circle cx="0" cy="0" r="6" fill="#00f2fe" filter="url(#chatPacketGlow)"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
    </g>
  </g>

  <!-- ================= CONDUIT 2: IN-MEMORY ➔ VIRTUALIZER (Between x=765 and x=830) ================= -->
  <g transform="translate(765, 235)">
    <!-- Conduit backing pipe -->
    <line x1="0" y1="0" x2="65" y2="0" stroke="#0e1b24" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="65" y2="0" stroke="url(#wireEmeraldViolet)" stroke-width="3" class="flow-wire" stroke-linecap="round"/>
    
    <!-- Conduit Label Badge (Centered, fits neatly inside 65px gap without clipping) -->
    <g transform="translate(32, -22)">
      <rect x="-28" y="-9" width="56" height="18" rx="9" fill="#041212" stroke="#10b981" stroke-opacity="0.6" stroke-width="1"/>
      <text x="0" y="3.5" text-anchor="middle" fill="#34d399" font-size="8" font-weight="700" class="mono">STREAM</text>
    </g>

    <!-- Animated Data Packet 2 -->
    <g class="packet-2">
      <circle cx="0" cy="0" r="6" fill="#10b981" filter="url(#chatPacketGlow)"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
    </g>
  </g>


  <!-- ================= NODE 1: STREAM INGESTION & PARSER ================= -->
  <g transform="translate(40, 72)">
    <!-- Main Card Frame (330 x 335) -->
    <rect x="0" y="0" width="330" height="335" rx="12" fill="url(#ingestGrad)" stroke="#00f2fe" stroke-width="1.4" class="box-ingest" filter="url(#chatSoftGlow)"/>
    
    <!-- Card Header Banner -->
    <rect x="0" y="0" width="330" height="42" rx="12" fill="#072036"/>
    <circle cx="20" cy="21" r="5" fill="#00f2fe" filter="url(#chatSoftGlow)"/>
    <text x="34" y="26" fill="#ffffff" font-size="12.5" font-weight="800" class="sans" letter-spacing="1">1. INGESTION &amp; PARSER</text>
    <rect x="245" y="10" width="72" height="22" rx="11" fill="#030e1a" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1"/>
    <text x="281" y="24" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="700" class="mono">STREAM</text>

    <!-- Step 1.1: Multi-Format Tokenizer -->
    <g transform="translate(14, 54)">
      <rect x="0" y="0" width="302" height="80" rx="8" fill="#040e1c" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1"/>
      <text x="14" y="24" fill="#38bdf8" font-size="12" font-weight="800" class="mono">📱 Multi-Format Tokenizer</text>
      <text x="14" y="47" fill="#94a3b8" font-size="10.5" class="sans">Auto-detects iOS [brackets] &amp; Android dashes</text>
      <text x="14" y="67" fill="#64748b" font-size="9.5" class="mono">Regex: Sub-ms timestamp &amp; author extraction</text>
    </g>

    <!-- Step 1.2: Lazy Chunk Processing -->
    <g transform="translate(14, 146)">
      <rect x="0" y="0" width="302" height="80" rx="8" fill="#040e1c" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1"/>
      <text x="14" y="24" fill="#00f2fe" font-size="12" font-weight="800" class="mono">⚡ Chunked Memory Stream</text>
      <text x="14" y="47" fill="#94a3b8" font-size="10.5" class="sans">Streams multi-megabyte exports without lag</text>
      <text x="14" y="67" fill="#64748b" font-size="9.5" class="mono">Yields to main thread via requestIdleCallback</text>
    </g>

    <!-- Step 1.3: Media Tag Cleanser -->
    <g transform="translate(14, 238)">
      <rect x="0" y="0" width="302" height="80" rx="8" fill="#040e1c" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1"/>
      <text x="14" y="24" fill="#38bdf8" font-size="12" font-weight="800" class="mono">🧹 Media Tag Cleanser</text>
      <text x="14" y="47" fill="#94a3b8" font-size="10.5" class="sans">Isolates &lt;Media omitted&gt; &amp; system alerts</text>
      <text x="14" y="67" fill="#64748b" font-size="9.5" class="mono">Sanitizes strings against XSS / DOM injection</text>
    </g>
  </g>


  <!-- ================= NODE 2: CLIENT MEMORY CORE ================= -->
  <g transform="translate(435, 72)">
    <!-- Main Card Frame (330 x 335) -->
    <rect x="0" y="0" width="330" height="335" rx="12" fill="url(#memoryGrad)" stroke="#10b981" stroke-width="1.4" class="box-memory" filter="url(#chatSoftGlow)"/>
    
    <!-- Card Header Banner -->
    <rect x="0" y="0" width="330" height="42" rx="12" fill="#0a2a22"/>
    <circle cx="20" cy="21" r="5" fill="#10b981" filter="url(#chatSoftGlow)"/>
    <text x="34" y="26" fill="#ffffff" font-size="12.5" font-weight="800" class="sans" letter-spacing="1">2. IN-MEMORY STORE</text>
    <rect x="225" y="10" width="92" height="22" rx="11" fill="#031411" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
    <text x="271" y="24" text-anchor="middle" fill="#34d399" font-size="8.5" font-weight="700" class="mono">ZERO-SERVER</text>

    <!-- Step 2.1: Flat RAM Memory Heap -->
    <g transform="translate(14, 54)">
      <rect x="0" y="0" width="302" height="80" rx="8" fill="#051614" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
      <text x="14" y="24" fill="#34d399" font-size="12" font-weight="800" class="mono">🧠 Flat RAM Memory Heap</text>
      <text x="14" y="47" fill="#94a3b8" font-size="10.5" class="sans">Stores 100,000+ records purely in browser RAM</text>
      <text x="14" y="67" fill="#64748b" font-size="9.5" class="mono">Zero API calls, Zero cloud telemetry, 0 KB wire</text>
    </g>

    <!-- Step 2.2: Sub-ms Search Index Trees -->
    <g transform="translate(14, 146)">
      <rect x="0" y="0" width="302" height="80" rx="8" fill="#051614" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
      <text x="14" y="24" fill="#10b981" font-size="12" font-weight="800" class="mono">⚡ Sub-ms Inverted Search</text>
      <text x="14" y="47" fill="#94a3b8" font-size="10.5" class="sans">Indexed author, timestamp &amp; keyword queries</text>
      <text x="14" y="67" fill="#64748b" font-size="9.5" class="mono">Instant date-range slice via binary search</text>
    </g>

    <!-- Step 2.3: Ephemeral Lifecycle -->
    <g transform="translate(14, 238)">
      <rect x="0" y="0" width="302" height="80" rx="8" fill="#051614" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
      <text x="14" y="24" fill="#34d399" font-size="12" font-weight="800" class="mono">🛡️ Ephemeral Lifecycle</text>
      <text x="14" y="47" fill="#94a3b8" font-size="10.5" class="sans">No cookies, No localStorage, No IndexedDB</text>
      <text x="14" y="67" fill="#64748b" font-size="9.5" class="mono">Instant zero-trace garbage collection on close</text>
    </g>
  </g>


  <!-- ================= NODE 3: TANSTACK VIRTUALIZER ================= -->
  <g transform="translate(830, 72)">
    <!-- Main Card Frame (330 x 335) -->
    <rect x="0" y="0" width="330" height="335" rx="12" fill="url(#virtualGrad)" stroke="#8b5cf6" stroke-width="1.4" class="box-virtual" filter="url(#chatSoftGlow)"/>
    
    <!-- Card Header Banner -->
    <rect x="0" y="0" width="330" height="42" rx="12" fill="#1b1236"/>
    <circle cx="20" cy="21" r="5" fill="#8b5cf6" filter="url(#chatSoftGlow)"/>
    <text x="34" y="26" fill="#ffffff" font-size="12.5" font-weight="800" class="sans" letter-spacing="1">3. TANSTACK VIRTUALIZER</text>
    <rect x="250" y="10" width="67" height="22" rx="11" fill="#0b061c" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1"/>
    <text x="283" y="24" text-anchor="middle" fill="#a78bfa" font-size="9" font-weight="700" class="mono">60 FPS</text>

    <!-- Step 3.1: Dynamic Row Height Measurement -->
    <g transform="translate(14, 54)">
      <rect x="0" y="0" width="302" height="80" rx="8" fill="#0d0721" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1"/>
      <text x="14" y="24" fill="#a78bfa" font-size="12" font-weight="800" class="mono">📐 Dynamic Row Height</text>
      <text x="14" y="47" fill="#94a3b8" font-size="10.5" class="sans">Self-measuring cache handles 1 to 100-line texts</text>
      <text x="14" y="67" fill="#64748b" font-size="9.5" class="mono">Zero layout thrashing or cumulative layout shift</text>
    </g>

    <!-- Step 3.2: Windowed DOM Recycling -->
    <g transform="translate(14, 146)">
      <rect x="0" y="0" width="302" height="80" rx="8" fill="#0d0721" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1"/>
      <text x="14" y="24" fill="#c084fc" font-size="12" font-weight="800" class="mono">♻️ Windowed DOM Recycling</text>
      <text x="14" y="47" fill="#94a3b8" font-size="10.5" class="sans">Renders strictly ~18 active DOM nodes</text>
      <text x="14" y="67" fill="#64748b" font-size="9.5" class="mono">Viewport buffer maintains locked 60 FPS scroll</text>
    </g>

    <!-- Step 3.3: Dual Mode Projection -->
    <g transform="translate(14, 238)">
      <rect x="0" y="0" width="302" height="80" rx="8" fill="#0d0721" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1"/>
      <text x="14" y="24" fill="#a78bfa" font-size="12" font-weight="800" class="mono">📖 Dual Mode Projection</text>
      <text x="14" y="47" fill="#94a3b8" font-size="10.5" class="sans">Instant toggle: Chat Bubbles vs Prose Novel</text>
      <text x="14" y="67" fill="#64748b" font-size="9.5" class="mono">Tailwind CSS v4 + React 19 rendering core</text>
    </g>
  </g>


  <!-- ================= BOTTOM TELEMETRY SPECIFICATIONS BAR ================= -->
  <g transform="translate(40, 435)">
    <!-- Base Tray (1120px wide) -->
    <rect x="0" y="0" width="1120" height="52" rx="10" fill="#030814" stroke="#00f2fe" stroke-opacity="0.25" stroke-width="1"/>

    <!-- Spec Item 1: Render Loop Budget -->
    <g transform="translate(30, 16)">
      <circle cx="8" cy="8" r="3.5" fill="#10b981"/>
      <text x="20" y="5" fill="#64748b" font-size="8" font-weight="700" class="mono" letter-spacing="1">FRAME BUDGET</text>
      <text x="20" y="21" fill="#f8fafc" font-size="10.5" font-weight="700" class="mono">&lt; 16.6ms (Locked 60 FPS)</text>
    </g>

    <!-- Spec Item 2: Network Telemetry -->
    <g transform="translate(310, 16)">
      <circle cx="8" cy="8" r="3.5" fill="#00f2fe"/>
      <text x="20" y="5" fill="#64748b" font-size="8" font-weight="700" class="mono" letter-spacing="1">NETWORK TELEMETRY</text>
      <text x="20" y="21" fill="#f8fafc" font-size="10.5" font-weight="700" class="mono">0 KB (Zero-Server Architecture)</text>
    </g>

    <!-- Spec Item 3: Memory Footprint -->
    <g transform="translate(600, 16)">
      <circle cx="8" cy="8" r="3.5" fill="#8b5cf6"/>
      <text x="20" y="5" fill="#64748b" font-size="8" font-weight="700" class="mono" letter-spacing="1">HEAP FOOTPRINT</text>
      <text x="20" y="21" fill="#f8fafc" font-size="10.5" font-weight="700" class="mono">~15 MB per 100k Messages</text>
    </g>

    <!-- Spec Item 4: Framework Stack -->
    <g transform="translate(885, 16)">
      <circle cx="8" cy="8" r="3.5" fill="#38bdf8"/>
      <text x="20" y="5" fill="#64748b" font-size="8" font-weight="700" class="mono" letter-spacing="1">FRONTEND ARCHITECTURE</text>
      <text x="20" y="21" fill="#f8fafc" font-size="10.5" font-weight="700" class="mono">React 19 + TanStack Virtual</text>
    </g>
  </g>

</svg>